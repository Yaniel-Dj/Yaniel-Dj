name: Update Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1. CREAR LA CARPETA PRIMERO (Esto arregla el error)
      - name: Create profile directory
        run: mkdir -p profile

      # 2. GENERAR LAS TARJETAS NORMALES
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=radical&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      # 3. GENERAR LA RACHA (Para que no dependa de servidores externos)
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=radical&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      # 4. GUARDAR LOS CAMBIOS
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update Profile Cards" || exit 0
          git push
